<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="modelTitle">
  <title id="modelTitle">Schichtmodell eines ganzheitlichen Cloud-Betriebs: von der Infrastruktur über Managed Services, Beobachtbarkeit, Sicherheit bis zu Governance und Kosten</title>
  <defs>
    <style>
      .navy { fill:#0b1f3a; }
      .red { fill:#d72638; }
      .blue { fill:#aebbcf; }
      .paper { fill:#fbfaf7; }
      .lbl { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill:#0b1f3a; }
      .bandlabel { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill:#fbfaf7; font-size:21px; font-weight:700; }
      .chip { fill:#fbfaf7; stroke:#0b1f3a; stroke-width:2; }
      .chiptext { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill:#0b1f3a; font-size:16px; }
      .whitecaption { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill:#fbfaf7; font-size:16px; font-style:italic; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="820" class="paper"/>

  <text x="600" y="46" text-anchor="middle" class="lbl" font-size="30" font-weight="700">Ganzheitliches Betriebsmodell</text>
  <text x="600" y="76" text-anchor="middle" class="lbl" font-size="18" opacity="0.75">Fünf Schichten, die zusammen entscheiden, wie souverän und resilient eine Cloud-Lösung wirklich ist</text>

  <!-- Layer 5 (top) Governance & Kosten -->
  <rect x="90" y="110" width="1020" height="104" rx="14" class="red"/>
  <text x="118" y="144" class="bandlabel">Governance &amp; Kosten</text>
  <g transform="translate(118,164)">
    <rect x="0" y="0" width="256" height="34" rx="8" class="chip"/>
    <text x="128" y="23" text-anchor="middle" class="chiptext">FinOps / Cost-Monitoring</text>
    <rect x="270" y="0" width="193" height="34" rx="8" class="chip"/>
    <text x="366" y="23" text-anchor="middle" class="chiptext">Kapazitätsplanung</text>
    <rect x="477" y="0" width="166" height="34" rx="8" class="chip"/>
    <text x="560" y="23" text-anchor="middle" class="chiptext">Exit-Strategie</text>
  </g>

  <!-- Layer 4 Sicherheit & Identität -->
  <rect x="90" y="226" width="1020" height="104" rx="14" class="navy" opacity="0.95"/>
  <text x="118" y="260" class="bandlabel">Sicherheit &amp; Identität</text>
  <g transform="translate(118,280)">
    <rect x="0" y="0" width="130" height="34" rx="8" class="chip"/>
    <text x="65" y="23" text-anchor="middle" class="chiptext">IAM / RBAC</text>
    <rect x="144" y="0" width="202" height="34" rx="8" class="chip"/>
    <text x="245" y="23" text-anchor="middle" class="chiptext">Secrets-Management</text>
    <rect x="360" y="0" width="184" height="34" rx="8" class="chip"/>
    <text x="452" y="23" text-anchor="middle" class="chiptext">Patch-Automation</text>
  </g>

  <!-- Layer 3 Beobachtbarkeit & Wiederherstellbarkeit -->
  <rect x="90" y="342" width="1020" height="104" rx="14" class="red" opacity="0.9"/>
  <text x="118" y="376" class="bandlabel">Beobachtbarkeit &amp; Wiederherstellbarkeit</text>
  <g transform="translate(118,396)">
    <rect x="0" y="0" width="220" height="34" rx="8" class="chip"/>
    <text x="110" y="23" text-anchor="middle" class="chiptext">Monitoring / Logging</text>
    <rect x="234" y="0" width="184" height="34" rx="8" class="chip"/>
    <text x="326" y="23" text-anchor="middle" class="chiptext">Backup &amp; Restore</text>
    <rect x="432" y="0" width="229" height="34" rx="8" class="chip"/>
    <text x="546" y="23" text-anchor="middle" class="chiptext">GitOps: ArgoCD / Flux</text>
  </g>

  <!-- Layer 2 Managed Services -->
  <rect x="90" y="458" width="1020" height="104" rx="14" class="navy" opacity="0.85"/>
  <text x="118" y="492" class="bandlabel">Managed Services</text>
  <g transform="translate(118,512)">
    <rect x="0" y="0" width="90" height="34" rx="8" class="chip"/>
    <text x="45" y="23" text-anchor="middle" class="chiptext">DBaaS</text>
    <rect x="104" y="0" width="148" height="34" rx="8" class="chip"/>
    <text x="178" y="23" text-anchor="middle" class="chiptext">Auto-Scaling</text>
    <rect x="266" y="0" width="90" height="34" rx="8" class="chip"/>
    <text x="311" y="23" text-anchor="middle" class="chiptext">IaC</text>
  </g>

  <!-- Layer 1 (bottom, foundation) Infrastruktur -->
  <rect x="90" y="574" width="1020" height="104" rx="14" class="navy"/>
  <text x="118" y="608" class="bandlabel" font-size="22">Infrastruktur</text>
  <g transform="translate(118,628)">
    <rect x="0" y="0" width="260" height="34" rx="8" class="chip"/>
    <text x="130" y="23" text-anchor="middle" class="chiptext">Managed Kubernetes</text>
    <text x="300" y="23" class="whitecaption">statt selbst gepflegtem Cluster</text>
  </g>

  <!-- baseline: provider vs. own responsibility -->
  <line x1="90" y1="700" x2="1110" y2="700" stroke="#0b1f3a" stroke-width="3"/>
  <text x="90" y="730" class="lbl" font-size="17" font-weight="600">← eher Provider-Verantwortung</text>
  <text x="1110" y="730" text-anchor="end" class="lbl" font-size="17" font-weight="600">eigene fachliche Verantwortung →</text>

  <text x="600" y="768" text-anchor="middle" class="lbl" font-size="16" opacity="0.7">Je mehr Schichten geprüft an einen Provider gehen, desto mehr Kapazität bleibt für die eigentliche Anwendung.</text>
  <text x="600" y="792" text-anchor="middle" class="lbl" font-size="16" opacity="0.7">Verschwunden ist der Aufwand dadurch nicht — er verschiebt sich zu Auswahl, Audit und Steuerung.</text>
</svg>
