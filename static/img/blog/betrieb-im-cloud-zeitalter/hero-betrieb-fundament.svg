<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1408 768" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Eine Cloud schwebt über einem soliden Fundament aus gestapelten Betriebs-Bausteinen; eine kleine Figur mit Schraubenschlüssel hält das Fundament instand</title>
  <defs>
    <style>
      .navy { fill:#0b1f3a; }
      .red { fill:#d72638; }
      .blue { fill:#aebbcf; }
      .bluesoft { fill:#c9d3e0; }
      .paper { fill:#fbfaf7; }
      .stroke-navy { stroke:#0b1f3a; }
      .stroke-blue { stroke:#aebbcf; }
      .stroke-red { stroke:#d72638; }
    </style>
  </defs>

  <rect x="0" y="0" width="1408" height="768" class="paper"/>

  <!-- soft rear ground layer -->
  <path class="bluesoft" d="M0,620 C220,590 340,610 520,596 C700,582 760,600 900,592
    C1080,582 1180,602 1408,588 L1408,768 L0,768 Z"/>

  <!-- ===== cloud, floating, held up by nothing visible ===== -->
  <g transform="translate(704,230)">
    <path class="blue" opacity="0.9" d="M-230,20
      a70,70 0 0 1 66,-96 a92,92 0 0 1 176,-8 a72,72 0 0 1 60,128
      a60,60 0 0 1 -12,118 h-330 a66,66 0 0 1 -60,-116 a58,58 0 0 1 100,-26 z"/>
    <path fill="none" class="stroke-navy" stroke-width="4" d="M-230,20
      a70,70 0 0 1 66,-96 a92,92 0 0 1 176,-8 a72,72 0 0 1 60,128
      a60,60 0 0 1 -12,118 h-330 a66,66 0 0 1 -60,-116 a58,58 0 0 1 100,-26 z"/>
  </g>

  <!-- dashed tether lines from cloud down to the foundation: invisible dependency made visible -->
  <path fill="none" class="stroke-navy" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round"
    d="M560,340 C540,420 520,470 500,520"/>
  <path fill="none" class="stroke-navy" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round"
    d="M704,352 C704,420 704,470 704,520"/>
  <path fill="none" class="stroke-navy" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round"
    d="M848,340 C868,420 888,470 908,520"/>

  <!-- ===== foundation: stacked operating blocks carrying the cloud ===== -->
  <g>
    <!-- layer 1 (bottom, widest) -->
    <rect x="330" y="620" width="748" height="54" rx="10" class="navy"/>
    <!-- layer 2 -->
    <rect x="368" y="566" width="672" height="54" rx="10" class="navy" opacity="0.92"/>
    <!-- layer 3 -->
    <rect x="406" y="512" width="596" height="54" rx="10" class="navy" opacity="0.84"/>
    <!-- top plate the cloud rests on -->
    <rect x="444" y="480" width="520" height="32" rx="8" class="red"/>
  </g>

  <!-- seams on the foundation blocks -->
  <g class="stroke-blue" stroke-width="2" opacity="0.6">
    <line x1="330" y1="647" x2="1078" y2="647"/>
    <line x1="368" y1="593" x2="1040" y2="593"/>
    <line x1="406" y1="539" x2="1002" y2="539"/>
  </g>

  <!-- ===== small operator figure tending the foundation ===== -->
  <g transform="translate(258,586)">
    <ellipse cx="0" cy="96" rx="70" ry="18" class="blue" opacity="0.5"/>
    <circle cx="0" cy="0" r="24" class="navy"/>
    <rect x="-30" y="22" width="60" height="58" rx="14" class="navy"/>
    <!-- wrench -->
    <g transform="translate(34,44) rotate(28)">
      <rect x="-6" y="-34" width="12" height="46" rx="4" class="red"/>
      <circle cx="0" cy="-34" r="12" class="red"/>
      <circle cx="0" cy="-34" r="5" class="paper"/>
    </g>
  </g>

  <!-- second operator figure on the right, checking a monitoring panel -->
  <g transform="translate(1140,590)">
    <ellipse cx="0" cy="92" rx="70" ry="18" class="blue" opacity="0.5"/>
    <circle cx="-6" cy="0" r="24" class="navy"/>
    <rect x="-36" y="22" width="60" height="58" rx="14" class="navy"/>
    <!-- small panel with pulse line -->
    <rect x="30" y="-6" width="86" height="58" rx="8" class="navy"/>
    <rect x="38" y="2" width="70" height="42" rx="4" class="paper"/>
    <polyline points="42,26 56,26 62,12 70,38 78,20 106,20" fill="none" class="stroke-red" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- small floating dots: scattered workloads riding on the foundation -->
  <g class="red">
    <circle cx="500" cy="466" r="6"/>
    <circle cx="704" cy="452" r="6"/>
    <circle cx="908" cy="466" r="6"/>
  </g>
</svg>
